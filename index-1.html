 root.innerHTML="<style>\n:host {\n  color-scheme: light;\n  --blue: #1677ce;\n  font: 16px/1.7 \"PingFang SC\",\"Microsoft YaHei\",Arial,sans-serif;\n  color: #272b30;\n  background: #f3f5f7;\n}\n* { box-sizing: border-box }\nbody { margin: 0 }\nmain {\n  max-width: 880px;\n  margin: 26px auto;\n  padding: 32px clamp(24px,5vw,68px) 42px;\n  background: white;\n  border-top: 4px solid var(--blue);\n  box-shadow: 0 2px 14px #26384b0b;\n}\nh1 { margin: 0 0 22px; color: var(--blue); text-align: center; font-size: 28px; line-height: 1.5 }\n.intro { padding-bottom: 21px; border-bottom: 1px solid #e2e5e9 }\np { margin: 0 }\np + p { margin-top: 8px }\nfieldset { border: 0; margin: 23px 0 0; padding: 0; min-width: 0 }\nlegend { padding: 0; font-weight: 650; line-height: 1.6 }\n.star { color: #d84646; margin-right: 5px }\n.num { margin-right: 6px }\n.hint { color: #646b72; font-size: 14px; margin: 5px 0 }\n.choices { display: grid; margin-top: 5px }\nlabel { display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 36px; cursor: pointer }\ninput { width: 18px; height: 18px; margin: 0; accent-color: var(--blue); flex: none }\nlabel:has(:checked) { background: #eef7ff; color: #105fa7 }\nlabel:has(:focus-visible),button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px }\n@media (hover: hover) { label:hover { background: #f4f8fb } }\n.actions { text-align: center; padding-top: 24px; margin-top: 20px; border-top: 1px solid #e2e5e9 }\n.progress { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 12px; color: #646b72; font-size: 14px }\nprogress { height: 5px; width: 76px; border: 0; border-radius: 5px; background: #e5ebf1; overflow: hidden }\nprogress::-webkit-progress-bar { background: #e5ebf1 }\nprogress::-webkit-progress-value { background: var(--blue) }\nprogress::-moz-progress-bar { background: var(--blue) }\nbutton { border: 0; border-radius: 4px; font: inherit; font-weight: 600; background: var(--blue); color: white; min-height: 44px; min-width: 150px; cursor: pointer }\nbutton:disabled { background: #dee5ec; color: #536171; cursor: default }\n.result { border-top: 1px solid #e2e5e9; padding: 24px 0 }\nh2 { font-size: 19px; margin: 0 0 8px }\n[hidden] { display: none !important }\n@media (max-width: 640px) {\n  :host { background: white }\n  main { margin: 0; padding: 22px 18px max(28px,env(safe-area-inset-bottom)); box-shadow: none; min-height: 100vh }\n  h1 { font-size: 24px; margin-bottom: 18px }\n  .choices { margin-top: 10px; border: 1px solid #dce1e6; border-radius: 4px; overflow: hidden }\n  label { min-height: 46px }\n  label + label { border-top: 1px solid #e4e8ec }\n  button { width: 100%; min-height: 46px }\n}\n\n:host{display:block;background:white;color:#333;font-family:\"Helvetica Neue\",Arial,\"PingFang SC\",sans-serif}\nmain{max-width:800px;background:white;border:0;box-shadow:none;margin:0 auto;padding:35px 20px 64px}\nh1{color:#0095ff;line-height:30px;font-size:22px;font-weight:600;letter-spacing:0;margin:0 0 23px}\n</style><main>\n<h1 id=\"title\">AI使用体验调研</h1>\n<form class=\"card\" id=\"form\" autocomplete=\"off\">\n<div class=\"intro\"><p>欢迎参加本研究。你将进入一个模拟的工作场景，指导AI让它规划一次部门聚餐。你需要用自己的话向 AI 发送三条消息，随后回答关于这次互动的问题。</p><p>参与完全自愿，你可以在提交前退出。研究将记录你发送的文字、问卷答案和页面作答时间，用于研究分析。</p></div>\n<fieldset><legend><span class=\"star\" aria-hidden=\"true\">*</span><span class=\"num\">1.</span>我已阅读以上说明，并自愿参加本研究。</legend><div class=\"choices\"><label><input type=\"radio\" name=\"consent\" value=\"yes\" required>同意参加</label><label><input type=\"radio\" name=\"consent\" value=\"no\">不同意参加</label></div></fieldset>\n<fieldset><legend><span class=\"star\" aria-hidden=\"true\">*</span><span class=\"num\">2.</span>你是否已年满 18 周岁？</legend><div class=\"choices\"><label><input type=\"radio\" name=\"adult\" value=\"yes\" required>是</label><label><input type=\"radio\" name=\"adult\" value=\"no\">否</label></div></fieldset>\n<fieldset aria-describedby=\"example\"><legend><span class=\"star\" aria-hidden=\"true\">*</span><span class=\"num\">3.</span>过去一个月，你是否使用过生成式 AI？</legend><p class=\"hint\" id=\"example\">例如向 AI 提问、让它生成内容或协助你完成任务。</p><div class=\"choices\"><label><input type=\"radio\" name=\"ai\" value=\"yes\" required>是</label><label><input type=\"radio\" name=\"ai\" value=\"no\">否</label></div></fieldset>\n<div class=\"actions\"><div class=\"progress\"><span id=\"count\" aria-live=\"polite\">已完成 0 / 3 题</span><progress id=\"meter\" value=\"0\" max=\"3\" aria-label=\"作答进度\"></progress></div><button disabled>下一步</button></div></form>\n<section class=\"card result\" id=\"result\" tabindex=\"-1\" hidden><h2 id=\"heading\"></h2><p id=\"message\"></p></section>\n</main>";

const form=root.querySelector('form');
const button=form.querySelector('button');
const key='ai-collaboration-yx-consent-v2';
const started=Date.now();
let finished=false;
function show(record){
  const {outcome}=record;
  finished=true;
  const passed=outcome==='passed';
  if(passed){host.remove();document.body.classList.remove('consent-page');startExperiment(record);return}
  form.hidden=true;
  root.querySelector('#title').textContent='本次问卷已结束';
  root.querySelector('#heading').textContent='感谢你的时间';
  root.querySelector('#message').textContent='根据你的选择，本次研究到此结束。你可以关闭此页面。';
  document.title='本次问卷已结束 · AI使用体验调研';
  const result=root.querySelector('#result');
  result.hidden=false;
  result.focus();
  window.scrollTo(0,0);
}
function end(outcome){
  const record={outcome,answers:Object.fromEntries(new FormData(form)),elapsedMs:Date.now()-started};
  try{sessionStorage.setItem(key,JSON.stringify(record))}catch{}
  show(record);
}
function update(){
  if(finished)return;
  const answers=[...new FormData(form).values()];
  button.disabled=answers.length!==3;
  root.querySelector('#count').textContent='已完成 '+answers.length+' / 3 题';
  root.querySelector('#meter').value=answers.length;
}
form.addEventListener('change',update);
form.addEventListener('submit',event=>{
  event.preventDefault();
  update();
  if (finished || button.disabled) return;
  const answers = [...new FormData(form).values()];
  end(answers.every(answer => answer === 'yes') ? 'passed' : 'ended');
});
function restore(){
  try{
    const saved=JSON.parse(sessionStorage.getItem(key));
    if(saved&&['ended','passed'].includes(saved.outcome)){show(saved);return}
  }catch{}
  update();
}
restore();
})();
</script></body></html>
